<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Posts</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="container">
        <h1>📚 Blog Posts</h1>
        <div class="input-field">
            <input type="text" id="api-base-url" placeholder="Enter API Base URL" value="http://127.0.0.1:5002/api">
            <button onclick="loadPosts()">Load Posts</button>
        </div>
        <div class="input-field">
            <input type="text" id="post-title" placeholder="Enter Post Title">
            <input type="text" id="post-author" placeholder="Enter Author Name">
            <input type="text" id="post-content" placeholder="Enter Post Content">
            <div class="action-buttons">
                <button id="add-update-btn" onclick="addPost()">Add Post</button>
                <button id="cancel-btn" style="display:none;" onclick="cancelUpdate()">Cancel</button>
            </div>
        </div>
        <div class="controls">
            <div class="search-box">
                <input type="text" id="search-query" placeholder="Search posts..." onkeyup="searchPosts()">
            </div>
            <div class="sort-box">
                <label for="sort-by">Sort by:</label>
                <select id="sort-by" onchange="loadPosts()">
                    <option value="id-desc">Newest First</option>
                    <option value="id-asc">Oldest First</option>
                    <option value="title-asc">Title (A-Z)</option>
                    <option value="title-desc">Title (Z-A)</option>
                </select>
            </div>
        </div>
        <div id="post-container">
            <!-- Blog posts will be inserted here by JavaScript -->
        </div>
    </div>

    <script src="static/main.js"></script>
</body>
</html>
